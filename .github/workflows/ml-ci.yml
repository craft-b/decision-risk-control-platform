name: ML Pipeline CI

on:
  push:
    branches: [main, feat/**]
    paths:
      - "ml-service/**"
      - ".github/workflows/ml-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml-service/**"
      - ".github/workflows/ml-ci.yml"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.9.7

      - name: Lint ml-service
        run: ruff check ml-service/ --select E,F,W --ignore E501,W291,W293

  smoke-test:
    name: Training smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install ML core without DB drivers or heavy optional deps
          pip install \
            scikit-learn==1.8.0 \
            imbalanced-learn==0.14.1 \
            numpy==2.4.1 \
            pandas==2.3.3 \
            joblib==1.5.3 \
            scipy==1.17.0 \
            pytest==8.3.5 \
            pytest-timeout==2.3.1

      - name: Run smoke tests
        run: python -m pytest tests/test_train_smoke.py -v --timeout=120
        env:
          # Disable MLflow and DB — smoke test is fully in-memory
          MLFLOW_TRACKING_URI: ""

      - name: Post metrics summary
        if: always()
        run: |
          python -m pytest tests/test_train_smoke.py -v --timeout=120 \
            --tb=no -q 2>/dev/null || true
          echo "### ML Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF'
          import sys, json
          sys.path.insert(0, ".")
          from tests.test_train_smoke import make_synthetic_df, HORIZONS
          from training.train_model_multihorizon import prepare_features, train_horizon_model
          import tempfile, pathlib, os
          import training.train_model_multihorizon as tm

          tmp = pathlib.Path(tempfile.mkdtemp())
          tm.MODEL_DIR = tmp
          tm.MODEL_DIR.mkdir(parents=True, exist_ok=True)

          df = make_synthetic_df(600)
          X, labels, feature_names, _ = prepare_features(df, "ci")

          rows = ["| Horizon | ROC-AUC | PR-AUC | Recall (fail) | Precision (fail) |",
                  "|---------|---------|--------|---------------|-----------------|"]
          for h in HORIZONS:
              y = labels[f"will_fail_{h}d"]
              _, m = train_horizon_model(X, y, h)
              rows.append(
                  f"| {h}d | {m['roc_auc']:.3f} | {m['pr_auc']:.3f} "
                  f"| {m['recall'][1]:.3f} | {m['precision'][1]:.3f} |"
              )
          print("\n".join(rows))
          EOF
          >> $GITHUB_STEP_SUMMARY
        env:
          MLFLOW_TRACKING_URI: ""

  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
